name: Camoufox trial build (macOS arm64)

'on':
  push:
    branches: [ci/epy-1099-mac-arm64]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      BUILD_TARGET: macos,arm64
      CAMOUFOX_UBO: >-
        {"version":"1.75.0","url":"https://addons.mozilla.org/firefox/downloads/file/5034826/ublock_origin-1.75.0.xpi","sha256":"5b74415860456370644bd80f16125e865b0e6c356bb5dfcfb84069967eaa5287"}

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-cached-tools: 'true'
          remove-swapfile: 'true'
          verbose: 'false'

      - name: Remove unused runner packages
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' '^dotnet-.*' '^llvm-.*' 'php.*' '^mongodb-.*' azure-cli google-chrome-stable firefox mono-devel --fix-missing
          sudo apt-get autoremove -y
          sudo apt-get clean

      - name: Check out the custom baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c3ad3bf2c3c6e93225aa6587246c8b70f9314664
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install the upstream build dependencies
        run: |
          wget https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 18
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib msitools p7zip-full aria2 ccache fontconfig
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/lib/llvm-18/bin/ld.lld 100

      - name: Set the build number from the baseline tag
        run: python3 -m ci.release set-build --tag v158.0.1-beta.41

      - name: Fetch the pinned font bundle
        working-directory: browser
        run: make fonts-extract

      - name: Prepare the source tree
        run: python3 -m ci.run_prepare

      - name: Create swap space
        run: |
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /

      - name: Build and package macOS arm64
        env:
          CARGO_BUILD_JOBS: '1'
        working-directory: browser
        run: python3 ./multibuild.py --target macos --arch arm64

      - name: Record the archive digest
        run: sha256sum browser/dist/camoufox-158.0.1-beta.41-mac.arm64.zip

      - name: Upload the build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: camoufox-v158.0.1-beta.41-mac-arm64
          path: browser/dist/camoufox-158.0.1-beta.41-mac.arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
